[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorcore"
version = "0.1.0"
description = "Espelhamento de infraestrutura, distribuição e sincronização de ambientes replicados."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
mirrorcore = "mirrorcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
